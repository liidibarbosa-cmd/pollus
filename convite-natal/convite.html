<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Convite de Natal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Cormorant+SC:wght@500;600&family=Mrs+Saint+Delafield&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root { --wine:#5c0a10; --cream:#fcf4ef; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; background:var(--cream); }
  .card {
    position:relative; width:1080px; height:1920px; overflow:hidden;
    background: repeating-linear-gradient(90deg, var(--cream) 0 88px, var(--wine) 88px 176px);
    background-position: -36px 0;
  }
  .panel {
    position:absolute; left:115px; top:250px; width:850px; height:1420px;
    background:var(--cream); color:var(--wine);
    display:flex; flex-direction:column; align-items:center;
    font-family:'Cormorant Garamond', serif;
  }
  .head { position:relative; width:100%; height:330px; margin-top:10px; }
  .tis { position:absolute; top:40px; left:0; right:0; text-align:center;
         font-size:72px; font-weight:600; letter-spacing:4px; }
  .script-big { position:absolute; top:110px; left:0; right:0; text-align:center;
         font-family:'Mrs Saint Delafield', cursive; font-size:250px; line-height:1;
         transform:rotate(-4deg); }
  .invited { font-size:46px; font-weight:500; letter-spacing:4px; margin-top:0px; }
  svg.table { width:560px; margin-top:14px; }
  .festive { font-family:'Pinyon Script', cursive; font-size:84px; line-height:1; margin-top:4px; }
  .party { font-size:80px; font-weight:600; letter-spacing:3px; line-height:1; margin-top:6px; }
  .rsvp {
    margin-top:30px; border:3px solid var(--wine); padding:16px 34px 14px;
    background:var(--wine); color:var(--cream); text-align:center;
    outline:2px solid var(--wine); outline-offset:8px;
  }
  .rsvp .t { font-size:42px; font-weight:700; letter-spacing:4px; line-height:1.1; }
  .rsvp .d { font-family:'Pinyon Script', cursive; font-size:58px; line-height:1.05; }
  .welcome { margin-top:26px; text-align:center; font-size:33px; font-weight:500; line-height:1.3; padding:0 50px; }
  .welcome em { font-family:'Pinyon Script', cursive; font-style:normal; font-size:52px; }
  .foot { position:absolute; left:34px; right:34px; bottom:34px;
          display:flex; justify-content:space-between; align-items:flex-end; }
  .date { font-family:'Cormorant SC', serif; font-size:66px; font-weight:600; line-height:1; }
  .date small { display:block; font-size:44px; margin-top:6px; }
  .addr { font-family:'Cormorant SC', serif; text-align:right; font-size:38px; font-weight:600; line-height:1.15; }
</style>
</head>
<body>
<div class="card">
  <div class="panel">
    <div class="head">
      <div class="tis">É TEMPO DE</div>
      <div class="script-big">Natal</div>
    </div>
    <div class="invited">VOCÊS ESTÃO CONVIDADOS</div>

    <svg class="table" viewBox="0 0 800 430" fill="none" stroke="#5c0a10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

      <path d="M72 215 q 30 18 60 4 q 30 18 60 4 q 30 18 60 4 q 30 18 60 4 q 30 18 60 4 q 30 18 60 4 q 30 18 60 4 q 30 18 60 4 q 30 18 60 4 q 30 18 60 4 q 30 18 60 4" stroke-width="2.5"/>

      <rect x="518" y="90" width="12" height="55"/><path d="M524 90 v -7"/>

      <!-- roast on platter -->
      <ellipse cx="400" cy="172" rx="95" ry="22"/>

      <!-- bottle -->

      <!-- small tree -->
      <path d="M600 175 l -36 0 l 22 -28 l -14 0 l 20 -26 l -10 0 l 18 -26 l 18 26 l -10 0 l 20 26 l -14 0 l 22 28 z" transform="translate(30,-8)"/>
      <path d="M640 85 l 3 -7 l 3 7 l 7 1 l -5 5 l 1 7 l -6 -3 l -6 3 l 1 -7 l -5 -5 z" transform="translate(-30,-10)" fill="#5c0a10"/>
      <circle cx="620" cy="140" r="3" fill="#5c0a10"/><circle cx="640" cy="118" r="3" fill="#5c0a10"/><circle cx="604" cy="160" r="3" fill="#5c0a10"/><circle cx="642" cy="158" r="3" fill="#5c0a10"/>
      <!-- holly sprigs -->
      <path d="M300 205 c 10 -12 26 -12 34 0 c -10 6 -24 6 -34 0 z" stroke-width="1.8"/>
      <path d="M466 205 c 10 -12 26 -12 34 0 c -10 6 -24 6 -34 0 z" stroke-width="1.8"/>
      <circle cx="338" cy="208" r="4" fill="#5c0a10"/><circle cx="462" cy="208" r="4" fill="#5c0a10"/>
    </svg>

    <div class="festive">para o Natal de</div>
    <div class="party">MARCHAN &amp; LIDI</div>

    <div class="rsvp">
      <div class="t">CONFIRME SUA PRESENÇA</div>
      <div class="d">até 01 de novembro</div>
    </div>

    <div class="welcome">
      <em>Todos são bem-vindos!</em><br>
      Traga o que for beber e 1 prato para a ceia.
    </div>

    <div class="foot">
      <div class="date">24 DEZ.<small>às 19h</small></div>
      <div class="addr">Nossa casa<br>Rua Chukichi Kakuda<br>nº 5613</div>
    </div>
  </div>
</div>
</body>
</html>
